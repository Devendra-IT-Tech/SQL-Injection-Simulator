<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Injection Lab</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; text-align: center; color: #f38ba8; }
    .mode-toggle { display: flex; gap: 8px; margin-bottom: 1.2rem; background: #2a2a2a; padding: 4px; border-radius: 8px; }
    .mode-toggle button { flex: 1; padding: 0.6rem; border: none; background: transparent; color: #888; font-weight: bold; cursor: pointer; border-radius: 6px; }
    .mode-toggle button.active-vuln { background: #f38ba8; color: #121212; }
    .mode-toggle button.active-sec { background: #51cf66; color: #121212; }
    input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #333; background: #2a2a2a; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
    button.submit-btn { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; background: #007bff; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button.submit-btn:hover { background: #0056b3; }
    .box { margin-top: 1.2rem; background: #000; padding: 0.8rem; border-radius: 6px; border: 1px solid #333; }
    .box-title { font-size: 0.75rem; text-transform: uppercase; color: #888; margin-bottom: 0.4rem; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>SQL Injection Simulator</h2>

    <div class="mode-toggle">
      <button id="btn-vuln" class="active-vuln" onclick="selectMode('vulnerable')">Vulnerable Mode</button>
      <button id="btn-sec" onclick="selectMode('secure')">Secure Mode</button>
    </div>

    <label>Username Payload:</label>
    <input type="text" id="username"/>

    <label>Password:</label>
    <input type="password" id="password" />

    <button class="submit-btn" onclick="submitLogin()">Execute Query</button>

    <div class="box">
      <div class="box-title">Executed SQL Query:</div>
      <pre id="sql-display" style="color: #f9e2af;">SELECT ...</pre>
    </div>

    <div class="box">
      <div class="box-title">Server Response:</div>
      <pre id="response-display">Click 'Execute Query' to test.</pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
